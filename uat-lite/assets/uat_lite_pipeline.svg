<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="UAT-LITE pipeline: stochastic embedding, online token uncertainty, uncertainty-aware attention, M passes, calibrated prediction">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset=".55" stop-color="#1e1b4b"/><stop offset="1" stop-color="#134e4a"/></linearGradient>
<linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
</defs>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e2e8f0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.title{font-size:28px;font-weight:800}
.hd{font-size:16px;font-weight:700}
.cap{font-size:13px;fill:#cbd5e1}
.sm{font-size:11px;fill:#94a3b8}
.box{fill:rgba(255,255,255,.05);stroke-width:1.6}
.flow{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
.chip rect{fill:rgba(255,255,255,.07);stroke:#475569}
.chip text{font-size:14px;text-anchor:middle}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes flick{0%,100%{opacity:.95}45%{opacity:.95}50%{opacity:.08}60%{opacity:.95}}
@keyframes dim{0%,100%{opacity:.9}50%{opacity:.1}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
</style>
<rect width="1200" height="480" rx="18" fill="url(#bg)"/>
<text class="title" x="28" y="50" fill="url(#ttl)" style="fill:url(#ttl)">How UAT-LITE works</text>
<text class="cap" x="28" y="74">one fine-tuned model, M stochastic forward passes, no retraining</text>
<rect class="box" x="24" y="96" width="200" height="236" rx="14" stroke="#67e8f9"/>
<text class="hd" x="124.0" y="124" text-anchor="middle" style="fill:#67e8f9">① Stochastic embedding</text>
<text class="cap mono" x="124.0" y="284" text-anchor="middle">z⁽ᵐ⁾ = Dropout(E(x))</text>
<text class="sm" x="124.0" y="306" text-anchor="middle">p_emb = 0.1</text>
<rect class="box" x="256" y="96" width="200" height="236" rx="14" stroke="#fbbf24"/>
<text class="hd" x="356.0" y="124" text-anchor="middle" style="fill:#fbbf24">② Token uncertainty</text>
<text class="cap mono" x="356.0" y="284" text-anchor="middle">Û = running std</text>
<text class="sm" x="356.0" y="306" text-anchor="middle">Welford · mean over hidden dim</text>
<rect class="box" x="488" y="96" width="200" height="236" rx="14" stroke="#a78bfa"/>
<text class="hd" x="588.0" y="124" text-anchor="middle" style="fill:#a78bfa">③ Uncertainty-aware attn</text>
<text class="cap mono" x="588.0" y="284" text-anchor="middle">ã = a · exp(−λ·u)</text>
<text class="sm" x="588.0" y="306" text-anchor="middle">×12 layers · p = 0.2 / 0.3</text>
<rect class="box" x="720" y="96" width="200" height="236" rx="14" stroke="#f472b6"/>
<text class="hd" x="820.0" y="124" text-anchor="middle" style="fill:#f472b6">④ M stochastic passes</text>
<text class="cap mono" x="820.0" y="284" text-anchor="middle">logits⁽¹⁾ … logits⁽ᴹ⁾</text>
<text class="sm" x="820.0" y="306" text-anchor="middle">M = 10 by default</text>
<rect class="box" x="952" y="96" width="200" height="236" rx="14" stroke="#4ade80"/>
<text class="hd" x="1052.0" y="124" text-anchor="middle" style="fill:#4ade80">⑤ Calibrated prediction</text>
<text class="cap mono" x="1052.0" y="284" text-anchor="middle">p = softmax(mean / T)</text>
<text class="sm" x="1052.0" y="306" text-anchor="middle">T fit on held-out dev</text>
<text class="sm" x="42" y="148">E(x)</text>
<text class="sm" x="42" y="208">z⁽ᵐ⁾</text>
<rect x="42" y="154" width="28" height="28" rx="5" fill="#64748b" opacity=".6"/>
